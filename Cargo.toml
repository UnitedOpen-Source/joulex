[package]
authors = [
    "Matheus Breguêz <matbrgz@gmail.com>",
    "David Peter <mail@david-peter.de>",
]
categories = ["command-line-utilities"]
description = "Multi-dimensional command-line benchmarking tool with energy and deep stats"
homepage = "https://github.com/UnitedOpen-Source/joulex"
license = "MIT OR Apache-2.0"
name = "joulex"
readme = "README.md"
repository = "https://github.com/UnitedOpen-Source/joulex"
version = "0.1.0"
edition = "2021"
build = "build.rs"
rust-version = "1.88.0"
# Only ship what is needed to build, test and document the crate
# (no CI config, specs, scripts or images).
include = [
    "/src/**/*",
    "/build.rs",
    "/tests/**/*",
    "/doc/joulex.1",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

# Prebuilt binaries for `cargo binstall joulex`, matching the release archives
# built by .github/workflows/CICD.yml: joulex-v<version>-<target>.tar.gz (.zip on
# Windows) containing joulex-v<version>-<target>/joulex(.exe).
# The extension is spelled out because binstall's { archive-suffix } is ".tgz".
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.i686-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[features]
# Use the nightly feature windows_process_extensions_main_thread_handle
windows_process_extensions_main_thread_handle = []

[dependencies]
colored = "2.1"
indicatif = "0.18"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = "1.36"
rand = "0.8"
shell-words = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap_complete = "4.2"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(all(windows, not(windows_process_extensions_main_thread_handle)))'.dependencies]
once_cell = "1.19"

[target.'cfg(target_os="linux")'.dependencies]
nix = { version = "0.31", features = ["zerocopy"] }

[dependencies.clap]
version = "4"
default-features = false
features = [
    "std",
    "suggestions",
    "color",
    "wrap_help",
    "cargo",
    "help",
    "usage",
    "error-context",
]

[dev-dependencies]
approx = "0.5"
assert_cmd = "2.0"
insta = { version = "1.41.1", features = ["yaml"] }
predicates = "3.1"
tempfile = "3.23"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[build-dependencies]
clap = { version = "4.5", features = ["cargo"] }
clap_complete = "4.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
