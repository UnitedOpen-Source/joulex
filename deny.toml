# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on vulnerabilities, unsound crates, yanked crates and unmaintained
# crates, except for the unmaintained ones below, which are tracked in issues.
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, pulled in by indicatif =0.17.4; tracked in #30" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix: unmaintained, pulled in by indicatif =0.17.4; tracked in #30" },
]

[licenses]
# joulex is MIT OR Apache-2.0; every dependency license must be compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
